name: Build Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  engine-smoke:
    name: Pikafish Linux UCI smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pikafish
        uses: actions/checkout@v4
        with:
          repository: official-pikafish/Pikafish
          ref: master
          path: pikafish-src

      - name: Download default NNUE network
        run: |
          curl -sL -o pikafish-src/src/pikafish.nnue "https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue"
          ls -la pikafish-src/src/pikafish.nnue
          test "$(stat -c%s pikafish-src/src/pikafish.nnue)" = "50308806"

      - name: Build Pikafish for Linux x86-64
        working-directory: pikafish-src/src
        run: |
          make -j"$(nproc)" build ARCH=x86-64 COMP=gcc EXE=pikafish-linux
          ls -la pikafish-linux

      # Phase A runs the binary WITH pikafish.nnue next to it: this is
      # the pass/fail gate for engine + UCI protocol + network file.
      # Phase B runs it alone in a clean directory and only RECORDS
      # whether the network turns out to be embedded in the binary.
      - name: UCI smoke test
        run: |
          mkdir -p smoke-a smoke-b
          cp pikafish-src/src/pikafish-linux smoke-a/
          cp pikafish-src/src/pikafish.nnue smoke-a/
          cp pikafish-src/src/pikafish-linux smoke-b/
          run_uci() {
            ( echo "uci"; sleep 2; echo "isready"; sleep 2; echo "position startpos"; echo "go depth 10"; sleep 25; echo "quit" ) | ./pikafish-linux > uci-smoke.log 2>&1 || true
            cat uci-smoke.log
          }
          echo "===== PHASE A: binary + pikafish.nnue ====="
          ( cd smoke-a && run_uci )
          echo "===== PHASE B: binary alone (embedding check) ====="
          ( cd smoke-b && run_uci ) || true
          cp smoke-a/uci-smoke.log uci-smoke-a.log
          cp smoke-b/uci-smoke.log uci-smoke-b.log
          if grep -q "^bestmove" smoke-b/uci-smoke.log; then
            echo "EMBEDDED=yes (binary runs standalone)" | tee embedded.txt
          else
            echo "EMBEDDED=no (binary needs the .nnue file at runtime)" | tee embedded.txt
          fi
          grep -q "uciok" smoke-a/uci-smoke.log
          grep -q "readyok" smoke-a/uci-smoke.log
          grep -q "^bestmove" smoke-a/uci-smoke.log
          echo "SMOKE OK"

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-uci-smoke-log
          path: |
            uci-smoke-a.log
            uci-smoke-b.log
            embedded.txt
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore cached Pikafish engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine-cache/libpikafish.so
          key: pikafish-master-arm64-universal-ndk28-v1

      - name: Checkout Pikafish
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: official-pikafish/Pikafish
          ref: master
          path: pikafish-src

      - name: Download default NNUE network (for embedding)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o pikafish-src/src/pikafish.nnue "https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue"
          ls -la pikafish-src/src/pikafish.nnue
          test "$(stat -c%s pikafish-src/src/pikafish.nnue)" = "50308806"

      # Android build recipe mirrors the Pikafish project's own CI:
      # NDK 28, ARCH=arm64-universal, COMP=ndk, static link.
      - name: Install NDK 28
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          ANDROID_ROOT=/usr/local/lib/android
          ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          echo "y" | $SDKMANAGER "ndk;28.2.13676358"
          echo "ANDROID_NDK_BIN=$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Build Pikafish for Android arm64
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: pikafish-src/src
        env:
          ARCH: arm64-universal
          COMP: ndk
          LDFLAGS: "-static -Wno-unused-command-line-argument"
        run: |
          export PATH="${{ env.ANDROID_NDK_BIN }}:$PATH"
          make -j4 build EXE=pikafish-android
          make strip EXE=pikafish-android
          ls -la pikafish-android
          mkdir -p "$GITHUB_WORKSPACE/engine-cache"
          cp pikafish-android "$GITHUB_WORKSPACE/engine-cache/libpikafish.so"

      - name: Place engine binary into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp engine-cache/libpikafish.so app/src/main/jniLibs/arm64-v8a/libpikafish.so
          ls -la app/src/main/jniLibs/arm64-v8a/
          file app/src/main/jniLibs/arm64-v8a/libpikafish.so || true

      - name: Download NNUE network into assets
        run: |
          mkdir -p app/src/main/assets/engine
          curl -sL -o app/src/main/assets/engine/pikafish.nnue "https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue"
          ls -la app/src/main/assets/engine/
          test "$(stat -c%s app/src/main/assets/engine/pikafish.nnue)" = "50308806"

      - name: Run unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace
          code=$?
          if [ "$code" != "0" ]; then
            echo "===== UNIT TEST RESULTS ====="
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] || continue
              grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || true
              python3 - "$f" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse(sys.argv[1])
          for tc in tree.getroot().iter('testcase'):
              for bad in list(tc):
                  if bad.tag in ('failure', 'error'):
                      msg = (bad.get('message') or '')[:300]
                      print(f"::error title=UnitTest::{tc.get('classname')}.{tc.get('name')}::{msg}")
          PYEOF
            done
            echo "===== COMPILER / TEST LOG TAIL ====="
            ls app/build/reports/tests/testDebugUnitTest/classes/ 2>/dev/null || true
          fi
          exit $code

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Report sizes (engine binary / NNUE / APK)
        run: |
          echo "== engine binary (jniLibs) =="
          stat -c "%s %n" app/src/main/jniLibs/arm64-v8a/libpikafish.so
          echo "== NNUE network (assets) =="
          stat -c "%s %n" app/src/main/assets/engine/pikafish.nnue
          echo "== APK =="
          ls -la app/build/outputs/apk/debug/
          stat -c "%s %n" app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | head -5
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep "certificate SHA-256 digest" | awk '{print $NF}')
          EXPECTED="db89ac16373bb138a12cac468178bb7ec5252cb93e344a05b44c075e910a863b"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Test signing pin did not take effect"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jiang-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
